[project]
name = "rime"
version = "0.1.0"
description = "Does changing weather (climate change, El Niño) show up in US aviation accident rates?"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "access-parser>=0.0.5",
    "openpyxl>=3.1",
    "requests>=2.32",
    "python-calamine>=0.9.0",
    "xarray>=2026.9.0",
    "h5netcdf>=1.8.2",
    "regionmask>=0.13.0",
    "cdsapi>=0.7.7",
]

[project.scripts]
rime = "rime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded real data"]
